name: langsmith
version: "1.0.0"
description: "Optional LangSmith observability for Hermes - traces conversations, LLM calls, and tool usage as the deep-claude-agent TaskTrace run-tree (chain -> llm -> tool). Opt-in via `hermes plugins enable observability/langsmith`."
author: NousResearch
requires_env:
  - LANGSMITH_API_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - api_request_error
